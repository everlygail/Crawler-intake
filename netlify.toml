[build]
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/crawler/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200

[[redirects]]
from = "/admin/"
to = "/admin.html"
status = 200

[[redirects]]
from = "/play"
to = "/play.html"
status = 200

[[redirects]]
from = "/play/"
to = "/play.html"
status = 200

[[redirects]]
from = "/game-master"
to = "/director-admin.html"
status = 200

[[redirects]]
from = "/game-master/"
to = "/director-admin.html"
status = 200

[[redirects]]
from = "/director"
to = "/director-admin.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
